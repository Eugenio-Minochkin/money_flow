name: Temporary desktop Mini App patch

on:
  push:
    branches:
      - fix/desktop-miniapp-window

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-miniapp-window
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply focused desktop fullscreen fix
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("apps/miniapp/src/app.js")
          app = app_path.read_text(encoding="utf-8")
          import_anchor = 'import { applyMiniAppTheme } from "./themeBackground.js";'
          import_line = 'import { shouldRequestTelegramFullscreen } from "./telegramPlatform.js";'
          assert import_anchor in app
          assert import_line not in app
          app = app.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          old_request = '  try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }'
          new_request = '''  if (shouldRequestTelegramFullscreen(webApp.platform)) {
            try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }
          }'''
          assert old_request in app
          app = app.replace(old_request, new_request, 1)
          app_path.write_text(app, encoding="utf-8")

          Path("apps/miniapp/src/telegramPlatform.js").write_text('''export function shouldRequestTelegramFullscreen(platform) {
            const normalized = String(platform ?? "").toLowerCase();
            return normalized === "ios" || normalized.startsWith("android");
          }
          ''', encoding="utf-8")

          Path("apps/miniapp/test/telegramPlatform.test.js").write_text('''import test from "node:test";
          import assert from "node:assert/strict";
          import { shouldRequestTelegramFullscreen } from "../src/telegramPlatform.js";

          test("Telegram mobile platforms may request fullscreen", () => {
            for (const platform of ["ios", "android", "android_x", "ANDROID"]) {
              assert.equal(shouldRequestTelegramFullscreen(platform), true, platform);
            }
          });

          test("Telegram desktop, web, and unknown platforms stay in the native shell", () => {
            for (const platform of ["tdesktop", "macos", "weba", "webk", "unigram", "unknown", "", null, undefined]) {
              assert.equal(shouldRequestTelegramFullscreen(platform), false, String(platform));
            }
          });
          ''', encoding="utf-8")

          old_version = "20260814-bundle-v5"
          new_version = "20260818-desktop-window-v1"
          index_path = Path("apps/miniapp/src/index.html")
          index = index_path.read_text(encoding="utf-8")
          assert old_version in index
          index_path.write_text(index.replace(old_version, new_version), encoding="utf-8")

          smoke_path = Path("apps/miniapp/test/smokeAssets.test.js")
          smoke = smoke_path.read_text(encoding="utf-8")
          assert old_version in smoke
          smoke = smoke.replace(old_version, new_version)
          anchor = '  assert.match(app, /function syncFullscreenControlSafeArea\\(\\)/);'
          guard_assertions = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
          const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
          const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
          assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
          assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);
          '''
          assert anchor in smoke
          smoke = smoke.replace(anchor, guard_assertions + anchor, 1)
          smoke_path.write_text(smoke, encoding="utf-8")

          principles_path = Path("docs/UI_PRINCIPLES.md")
          principles = principles_path.read_text(encoding="utf-8")
          principles_anchor = "- Support both small and large iPhone screens, including iPhone 11 and iPhone 14 Pro.\n"
          principles_line = "- Request Telegram fullscreen only on mobile client platforms; desktop and web clients should stay in their native compact Mini App shell.\n"
          assert principles_anchor in principles
          assert principles_line not in principles
          principles_path.write_text(principles.replace(principles_anchor, principles_anchor + principles_line, 1), encoding="utf-8")

          Path(".github/workflows/_tmp-desktop-miniapp-window.yml").unlink()

      - name: Install dependencies
        run: npm ci

      - name: Verify focused change
        run: |
          node --check apps/miniapp/src/app.js
          node --test apps/miniapp/test/telegramPlatform.test.js apps/miniapp/test/smokeAssets.test.js
          npm run build:miniapp
          git diff --check

      - name: Commit branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/miniapp/src/app.js apps/miniapp/src/index.html apps/miniapp/src/telegramPlatform.js apps/miniapp/test/smokeAssets.test.js apps/miniapp/test/telegramPlatform.test.js docs/UI_PRINCIPLES.md .github/workflows/_tmp-desktop-miniapp-window.yml
          git commit -m "Fix desktop Mini App fullscreen"
          git push origin HEAD:fix/desktop-miniapp-window
