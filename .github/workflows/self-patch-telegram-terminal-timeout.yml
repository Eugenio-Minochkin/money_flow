name: Self patch Telegram terminal timeout

on:
  push:
    branches: [fix/telegram-terminal-timeout]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/telegram-terminal-timeout

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply terminal-response fix and regression tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          telegram_path = Path('apps/api/src/telegram.js')
          source = telegram_path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              source = source.replace(old, new, 1)

          replace_once(
              'import { createTelegramJobQueue } from "./telegramJobQueue.js";\n',
              'import { createTelegramJobQueue } from "./telegramJobQueue.js";\nimport { createTelegramJobDeliveryState, markTelegramJobTerminalResponse, shouldNotifyTelegramJobFailure } from "./telegramJobOutcome.js";\n',
              'job outcome import'
          )

          replace_once(
              '''  const queued = telegramJobQueue.enqueue({\n    userId: from.id,\n    run: () => processQueuedMessage({ message, from, user, rawText, hasVoice, inputType: trackExpenseMessage ? inputType : null, repository, token, miniAppUrl, expenseParser, voiceTranscriber, telegramClient, adminTelegramIds, adminAlertService, now, trace }),\n''',
              '''  const deliveryState = createTelegramJobDeliveryState();\n  const queued = telegramJobQueue.enqueue({\n    userId: from.id,\n    run: () => processQueuedMessage({ message, from, user, rawText, hasVoice, inputType: trackExpenseMessage ? inputType : null, repository, token, miniAppUrl, expenseParser, voiceTranscriber, telegramClient, adminTelegramIds, adminAlertService, now, trace, deliveryState }),\n''',
              'queue delivery state'
          )

          failure_call = 'sendQueuedJobFailure({ error, token, chatId, language, telegramClient, adminAlertService, telegramUserId: from.id, userId: user.id, trace })'
          if source.count(failure_call) != 2:
              raise SystemExit(f'queued failure calls: expected 2 matches, found {source.count(failure_call)}')
          source = source.replace(
              failure_call,
              'sendQueuedJobFailure({ error, token, chatId, language, telegramClient, adminAlertService, telegramUserId: from.id, userId: user.id, trace, deliveryState })'
          )

          replace_once(
              'async function sendQueuedJobFailure({ error, token, chatId, language, telegramClient, adminAlertService, telegramUserId, userId, trace }) {\n',
              'async function sendQueuedJobFailure({ error, token, chatId, language, telegramClient, adminAlertService, telegramUserId, userId, trace, deliveryState }) {\n',
              'queued failure signature'
          )

          replace_once(
              '''  if (!error?.adminAlertSent) {\n    await safeNotifyAdminError(adminAlertService, error, {\n      source: "telegram",\n      operation: "queued_job",\n      telegramUserId,\n      userId\n    });\n  }\n  try {\n''',
              '''  if (!error?.adminAlertSent) {\n    await safeNotifyAdminError(adminAlertService, error, {\n      source: "telegram",\n      operation: "queued_job",\n      telegramUserId,\n      userId\n    });\n  }\n  if (!shouldNotifyTelegramJobFailure(deliveryState)) {\n    console.warn("[telegram] suppressing queued job failure after terminal response", {\n      telegramUserId,\n      userId,\n      message: error?.message ?? "unknown"\n    });\n    return;\n  }\n  try {\n''',
              'queued failure suppression'
          )

          replace_once(
              'export async function processQueuedMessage({ message, from, user, rawText, hasVoice, inputType, repository, token, miniAppUrl, expenseParser, voiceTranscriber, telegramClient, adminTelegramIds = new Set(), adminAlertService, now = () => new Date(), trace }) {\n',
              'export async function processQueuedMessage({ message, from, user, rawText, hasVoice, inputType, repository, token, miniAppUrl, expenseParser, voiceTranscriber, telegramClient, adminTelegramIds = new Set(), adminAlertService, now = () => new Date(), trace, deliveryState = createTelegramJobDeliveryState() }) {\n',
              'process signature'
          )

          process_start = source.index('export async function processQueuedMessage')
          process_end = source.index('\nasync function saveFeedbackMessage', process_start)
          block = source[process_start:process_end]

          delivery_count = block.count('deliverResultMessage(')
          if delivery_count < 5:
              raise SystemExit(f'queued delivery calls: expected at least 5 matches, found {delivery_count}')
          block = block.replace('deliverResultMessage(', 'deliverQueuedResult(')

          marker = '  let transcriptChars = null;\n\n'
          if block.count(marker) != 1:
              raise SystemExit(f'queued delivery wrapper marker: expected 1 match, found {block.count(marker)}')
          block = block.replace(
              marker,
              '''  let transcriptChars = null;\n\n  const deliverQueuedResult = async (input) => {\n    const delivered = await deliverResultMessage(input);\n    markTelegramJobTerminalResponse(deliveryState);\n    return delivered;\n  };\n\n''',
              1
          )

          replay_marker = '''        if (draft.tg_chat_id && draft.tg_message_id) {\n          processingResult = draft.status === "confirmed" ? "expense_saved" : "draft_created";\n          return sendTelegramResponse(trace, () => deleteMessage(token, chatId, loader.messageId, telegramClient)\n'''
          if block.count(replay_marker) != 1:
              raise SystemExit(f'replay terminal marker: expected 1 match, found {block.count(replay_marker)}')
          block = block.replace(
              replay_marker,
              '''        if (draft.tg_chat_id && draft.tg_message_id) {\n          processingResult = draft.status === "confirmed" ? "expense_saved" : "draft_created";\n          markTelegramJobTerminalResponse(deliveryState);\n          return sendTelegramResponse(trace, () => deleteMessage(token, chatId, loader.messageId, telegramClient)\n''',
              1
          )

          ref_marker = '          await repository.setDraftMessageRef'
          if block.count(ref_marker) != 2:
              raise SystemExit(f'post-delivery draft refs: expected 2 matches, found {block.count(ref_marker)}')
          block = block.replace(ref_marker, '          void repository.setDraftMessageRef')

          analytics_start = '      await safeRecordAppEvent(repository, user.id, "message_processing_completed", {\n'
          if block.count(analytics_start) != 1:
              raise SystemExit(f'processing analytics start: expected 1 match, found {block.count(analytics_start)}')
          block = block.replace(
              analytics_start,
              '      const recordProcessingCompleted = safeRecordAppEvent(repository, user.id, "message_processing_completed", {\n',
              1
          )

          analytics_end = '''        transcriptChars,\n        audioDurationSec: inputType === "voice" ? traceMetadata.audioDurationSec : undefined\n      });\n'''
          if block.count(analytics_end) != 1:
              raise SystemExit(f'processing analytics end: expected 1 match, found {block.count(analytics_end)}')
          block = block.replace(
              analytics_end,
              '''        transcriptChars,\n        audioDurationSec: inputType === "voice" ? traceMetadata.audioDurationSec : undefined\n      });\n      if (deliveryState.terminalResponseDelivered) {\n        void recordProcessingCompleted;\n      } else {\n        await recordProcessingCompleted;\n      }\n''',
              1
          )

          source = source[:process_start] + block + source[process_end:]

          replace_once(
              'async function saveFeedbackMessage({ feedbackText, repository, user, telegramUserId, chatId, token, telegramClient, adminTelegramIds, trace, language }) {\n',
              'async function saveFeedbackMessage({ feedbackText, repository, user, telegramUserId, chatId, token, telegramClient, adminTelegramIds, trace, language, deliveryState }) {\n',
              'feedback signature'
          )

          process_feedback_call = 'const result = await saveFeedbackMessage({ feedbackText, repository, user, telegramUserId: from.id, chatId, token, telegramClient, adminTelegramIds, trace, language });'
          if source.count(process_feedback_call) != 1:
              raise SystemExit(f'queued feedback call: expected 1 match, found {source.count(process_feedback_call)}')
          source = source.replace(
              process_feedback_call,
              'const result = await saveFeedbackMessage({ feedbackText, repository, user, telegramUserId: from.id, chatId, token, telegramClient, adminTelegramIds, trace, language, deliveryState });',
              1
          )

          replace_once(
              '''  await sendTelegramResponse(trace, () => sendMessage(token, chatId, feedbackAcceptedText(language), null, telegramClient));\n  await notifyAdminFeedback({\n''',
              '''  await sendTelegramResponse(trace, () => sendMessage(token, chatId, feedbackAcceptedText(language), null, telegramClient));\n  markTelegramJobTerminalResponse(deliveryState);\n  await notifyAdminFeedback({\n''',
              'feedback terminal response'
          )

          telegram_path.write_text(source)

          Path('apps/api/src/telegramJobOutcome.js').write_text('''export function createTelegramJobDeliveryState() {\n  return { terminalResponseDelivered: false };\n}\n\nexport function markTelegramJobTerminalResponse(state) {\n  if (state) state.terminalResponseDelivered = true;\n  return state;\n}\n\nexport function shouldNotifyTelegramJobFailure(state) {\n  return state?.terminalResponseDelivered !== true;\n}\n''')

          Path('apps/api/test/telegramJobOutcome.test.js').write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\n\nimport { processQueuedMessage } from "../src/telegram.js";\nimport {\n  createTelegramJobDeliveryState,\n  markTelegramJobTerminalResponse,\n  shouldNotifyTelegramJobFailure\n} from "../src/telegramJobOutcome.js";\n\ntest("queued job failures remain user-visible until a terminal response is delivered", () => {\n  const state = createTelegramJobDeliveryState();\n  assert.equal(shouldNotifyTelegramJobFailure(state), true);\n  markTelegramJobTerminalResponse(state);\n  assert.equal(shouldNotifyTelegramJobFailure(state), false);\n});\n\ntest("Smart Save returns after the terminal Telegram response even when post-delivery writes hang", async () => {\n  const calls = [];\n  let draftRefWriteStarted = false;\n  let completionAnalyticsStarted = false;\n  const never = () => new Promise(() => {});\n  const item = {\n    amount: 70,\n    currency: "THB",\n    description: "кофе",\n    category_slug: "food_cafe",\n    category_source: "parser",\n    needs_review: false,\n    spent_at: "2026-08-14T08:00:00.000Z",\n    budget_impact: "regular"\n  };\n  const repository = {\n    async createDraft(_userId, _text, items) {\n      return { id: 42, status: "pending", items };\n    },\n    async listClosedReserveMonthsForTelegramUser() {\n      return [];\n    },\n    async saveDraftAsExpense(draftId) {\n      return {\n        expenses: [{\n          id: 91,\n          draft_id: draftId,\n          amount_base: 70,\n          amount_original: 70,\n          currency_original: "THB",\n          description: "кофе",\n          category_slug: "food_cafe"\n        }],\n        dashboardSnapshot: {\n          today: 70,\n          week: 70,\n          month: 70,\n          monthlyBudget: 42000,\n          remaining: 41930,\n          plannedRemaining: 0,\n          freeRemaining: 41930,\n          budgetProgressPercent: 0.17,\n          forecastMonthTotal: 70,\n          planDeviation: -41930,\n          safeToSpendPerDay: 1352.58,\n          status: "below_plan"\n        },\n        alreadySaved: false\n      };\n    },\n    setDraftMessageRef() {\n      draftRefWriteStarted = true;\n      return never();\n    },\n    recordAppEvent(_userId, eventName) {\n      if (eventName === "message_processing_completed") {\n        completionAnalyticsStarted = true;\n        return never();\n      }\n      return Promise.resolve();\n    }\n  };\n  const telegramClient = {\n    async sendMessage(message) {\n      calls.push({ method: "sendMessage", ...message });\n      return { ok: true, result: { message_id: 501 } };\n    },\n    async editMessageText(message) {\n      calls.push({ method: "editMessageText", ...message });\n      return { ok: true, result: { message_id: 501 } };\n    },\n    async deleteMessage(message) {\n      calls.push({ method: "deleteMessage", ...message });\n      return { ok: true };\n    }\n  };\n  const trace = {\n    start() {},\n    end() {},\n    event() {},\n    failActive() {},\n    getDurations() { return {}; },\n    getMetadata() { return { llmParse: {} }; }\n  };\n  const deliveryState = createTelegramJobDeliveryState();\n\n  const processing = processQueuedMessage({\n    message: { chat: { id: 10 }, message_id: 77, text: "кофе 70" },\n    from: { id: 100 },\n    user: {\n      id: 1,\n      interface_language: "ru",\n      onboarding_step: "completed",\n      base_currency: "THB",\n      timezone: "Asia/Bangkok"\n    },\n    rawText: "кофе 70",\n    hasVoice: false,\n    inputType: "text",\n    repository,\n    token: "test-token",\n    miniAppUrl: "http://localhost:3000",\n    expenseParser: {\n      model: "test-model",\n      async parse() { return { expenses: [item] }; }\n    },\n    telegramClient,\n    now: () => new Date("2026-08-14T10:00:00.000Z"),\n    trace,\n    deliveryState\n  });\n\n  const result = await Promise.race([\n    processing,\n    new Promise((_, reject) => setTimeout(() => reject(new Error("processing stayed blocked after terminal response")), 250))\n  ]);\n\n  assert.equal(result.result.message_id, 501);\n  assert.equal(deliveryState.terminalResponseDelivered, true);\n  assert.equal(draftRefWriteStarted, true);\n  assert.equal(completionAnalyticsStarted, true);\n  assert.equal(calls.filter((call) => call.method === "editMessageText").length, 1);\n});\n''')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: node --test apps/api/test/telegramJobOutcome.test.js

      - name: Run full test suite
        run: npm test

      - name: Verify diff
        run: git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/self-patch-telegram-terminal-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/telegram.js apps/api/src/telegramJobOutcome.js apps/api/test/telegramJobOutcome.test.js .github/workflows/self-patch-telegram-terminal-timeout.yml
          git commit -m "fix: suppress false Telegram failure after terminal response"
          git push origin HEAD:fix/telegram-terminal-timeout
