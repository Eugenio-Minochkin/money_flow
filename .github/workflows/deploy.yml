name: CI and Deploy

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy. Leave empty to deploy the selected branch commit.
        required: false
        type: string

concurrency:
  group: money-flow-deploy
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  postgres-integration:
    name: Postgres integration smoke
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: money_flow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d money_flow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/money_flow_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Postgres smoke integration tests
        run: npm run test:integration:postgres

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: [ci, postgres-integration]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    environment: production

    steps:
      - name: Resolve deployed pull request
        id: release_pr
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ github.event.inputs.ref || github.sha }}
        run: |
          set -euo pipefail

          pr_number="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${DEPLOY_SHA}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "master")] | first | .number // empty'
          )"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          test -n "$PROD_SSH_HOST"
          test -n "$PROD_SSH_USER"
          test -n "$PROD_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/money_flow_deploy
          chmod 600 ~/.ssh/money_flow_deploy

          if [ -n "$PROD_SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$PROD_SSH_PORT" "$PROD_SSH_HOST" > ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
          PROD_APP_DIR: ${{ secrets.PROD_APP_DIR || '/opt/money-flow' }}
          DEPLOY_REF: ${{ github.event.inputs.ref || github.sha }}
          RELEASE_PR_NUMBER: ${{ steps.release_pr.outputs.pr_number }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RELEASE_SYNC_GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SYNC_GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          release_sync_token_file="$(
            ssh -i ~/.ssh/money_flow_deploy \
              -p "$PROD_SSH_PORT" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "umask 077; mktemp /tmp/money-flow-release-sync.XXXXXX"
          )"
          cleanup_remote_token() {
            ssh -i ~/.ssh/money_flow_deploy \
              -p "$PROD_SSH_PORT" \
              "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "rm -f '$release_sync_token_file'" || true
          }
          trap cleanup_remote_token EXIT

          printf '%s' "$RELEASE_SYNC_GITHUB_TOKEN" | ssh \
            -i ~/.ssh/money_flow_deploy \
            -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "umask 077; cat > '$release_sync_token_file'"

          ssh -i ~/.ssh/money_flow_deploy \
            -p "$PROD_SSH_PORT" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "APP_DIR='$PROD_APP_DIR' DEPLOY_REF='$DEPLOY_REF' RELEASE_PR_NUMBER='$RELEASE_PR_NUMBER' GITHUB_EVENT_NAME='$GITHUB_EVENT_NAME' RELEASE_SYNC_TOKEN_FILE='$release_sync_token_file' RELEASE_SYNC_GITHUB_REPOSITORY='$RELEASE_SYNC_GITHUB_REPOSITORY' bash -s" <<'REMOTE'
          set -euo pipefail

          cd "$APP_DIR"
          git fetch origin --prune --tags
          git checkout --force "$DEPLOY_REF"

          APP_REVISION="$(git rev-parse HEAD)"
          export APP_REVISION

          if git grep -Fq '/app/REVISION' HEAD -- Dockerfile; then
            revision_check_mode=exact_revision
          else
            revision_check_mode=legacy_rollback
          fi

          ENV_FILE="$APP_DIR/.env.production" \
          COMPOSE_FILE="$APP_DIR/compose.prod.yml" \
          BACKUP_DIR="$APP_DIR/backups/postgres" \
            "$APP_DIR/scripts/backup-postgres.sh" </dev/null

          verify_api_deployment() {
            api_container_id="$(
              docker compose --env-file .env.production -f compose.prod.yml ps -q api
            )"
            if [ -z "$api_container_id" ]; then
              echo "API container is not running" >&2
              return 1
            fi

            running_api_image_id="$(docker inspect --format '{{.Image}}' "$api_container_id")"
            if [ "$running_api_image_id" != "$built_api_image_id" ]; then
              echo "API image ID mismatch: expected $built_api_image_id, got ${running_api_image_id:-<empty>}" >&2
              return 1
            fi

            if [ "$revision_check_mode" = exact_revision ]; then
              if ! actual_revision="$(
                docker compose --env-file .env.production -f compose.prod.yml exec --interactive=false -T \
                  api cat /app/REVISION | tr -d '\r\n'
              )"; then
                echo "API revision marker is required for revision-aware checkout $APP_REVISION" >&2
                return 1
              fi
              if [ "$actual_revision" != "$APP_REVISION" ]; then
                echo "API revision mismatch: expected $APP_REVISION, got ${actual_revision:-<empty>}" >&2
                return 1
              fi
              echo "Verification mode: exact revision ($actual_revision)"
              return 0
            fi

            echo "Verification mode: legacy rollback (fresh image $running_api_image_id)"
          }

          verify_public_api_revision() {
            public_health_url="https://${APP_DOMAIN}/health"
            for attempt in $(seq 1 20); do
              if public_health="$(curl -fsS "$public_health_url" 2>/dev/null)" \
                && printf '%s' "$public_health" | docker compose --env-file .env.production -f compose.prod.yml exec -T \
                  api node -e '
                  let body = "";
                  process.stdin.on("data", (chunk) => { body += chunk; });
                  process.stdin.on("end", () => {
                    try {
                      const health = JSON.parse(body);
                      process.exit(health.ok === true && health.db === true && health.revision === process.argv[1] ? 0 : 1);
                    } catch {
                      process.exit(1);
                    }
                  });
                ' "$APP_REVISION"; then
                echo "Public API revision verified: $APP_REVISION"
                return 0
              fi
              sleep 3
            done
            echo "Public API revision mismatch: expected $APP_REVISION at $public_health_url" >&2
            return 1
          }

          verify_telegram_webhook() {
            set -a
            . ./.env.production
            set +a
            expected_webhook_url="https://${APP_DOMAIN}/telegram/webhook"
            webhook_curl_config="$(umask 077; mktemp /tmp/money-flow-webhook-info.XXXXXX)"
            trap 'rm -f "$webhook_curl_config"' RETURN
            printf 'url = "https://api.telegram.org/bot%s/getWebhookInfo"\n' "$TELEGRAM_BOT_TOKEN" > "$webhook_curl_config"
            webhook_url="$(curl -fsS --config "$webhook_curl_config" | docker compose --env-file .env.production -f compose.prod.yml exec -T \
              api node -e '
              let body = "";
              process.stdin.on("data", (chunk) => { body += chunk; });
              process.stdin.on("end", () => {
                try {
                  const payload = JSON.parse(body);
                  if (payload.ok !== true || !payload.result || typeof payload.result !== "object" || Array.isArray(payload.result)) {
                    process.exit(1);
                  }
                  process.stdout.write(typeof payload.result.url === "string" ? payload.result.url : "");
                } catch {
                  process.exit(1);
                }
              });
            ')" || return 1
            rm -f "$webhook_curl_config"
            trap - RETURN
            if [ "$webhook_url" != "$expected_webhook_url" ]; then
              echo "Telegram webhook URL mismatch: expected $expected_webhook_url, got ${webhook_url:-<empty>}" >&2
              return 1
            fi
            echo "Telegram webhook verified: $webhook_url"
          }

          release_digest_scheduler_disabled=0
          restore_release_digest_scheduler() {
            deploy_status=$?
            trap - EXIT
            rm -f "$RELEASE_SYNC_TOKEN_FILE"
            if [ "$release_digest_scheduler_disabled" -eq 1 ]; then
              if ! docker compose --env-file .env.production -f compose.prod.yml up -d --force-recreate api; then
                echo "Failed to restore the release digest scheduler after deploy" >&2
                exit 1
              fi
              if ! verify_api_deployment; then
                echo "Restored API container does not match the deployed build" >&2
                exit 1
              fi
            fi
            if [ "$deploy_status" -ne 0 ]; then
              exit "$deploy_status"
            fi
          }
          trap restore_release_digest_scheduler EXIT

          docker compose --env-file .env.production -f compose.prod.yml build --pull --no-cache api
          api_image_name="$(
            docker compose --env-file .env.production -f compose.prod.yml config api |
              awk '
                /^  api:$/ { in_api = 1; next }
                in_api && /^    image:/ { print $2; exit }
                in_api && /^  [^ ]/ { exit }
              '
          )"
          compose_project_name="$(
            docker compose --env-file .env.production -f compose.prod.yml config api |
              awk '$1 == "name:" { print $2; exit }'
          )"
          test -n "$compose_project_name"
          if [ -z "$api_image_name" ]; then
            api_image_name="${compose_project_name}-api"
          fi
          test -n "$api_image_name"
          built_api_image_id="$(docker image inspect --format '{{.Id}}' "$api_image_name")"
          release_digest_scheduler_disabled=1
          RELEASE_DIGEST_AUTO_SEND_ENABLED=false \
            docker compose --env-file .env.production -f compose.prod.yml up -d --no-deps --force-recreate api
          verify_api_deployment
          ./scripts/prod-security-check.sh </dev/null
          APP_DOMAIN="$(sed -n 's/^APP_DOMAIN=//p' .env.production | tail -n 1 | tr -d '\r')"
          test -n "$APP_DOMAIN"
          verify_public_api_revision
          verify_telegram_webhook

          if [ -n "$RELEASE_PR_NUMBER" ]; then
            release_sync_github_token="$(cat "$RELEASE_SYNC_TOKEN_FILE")"
            rm -f "$RELEASE_SYNC_TOKEN_FILE"
            test -n "$release_sync_github_token"
            export GITHUB_TOKEN="$release_sync_github_token"
            export GITHUB_REPOSITORY="$RELEASE_SYNC_GITHUB_REPOSITORY"
            if ! docker compose --env-file .env.production -f compose.prod.yml exec --interactive=false -T \
              -e GITHUB_TOKEN \
              -e GITHUB_REPOSITORY \
              api \
              npm run release-notes:sync-pr -- --pr="$RELEASE_PR_NUMBER"; then
              echo "Warning: release note sync failed for PR #$RELEASE_PR_NUMBER; deploy will continue." >&2
            fi
            unset GITHUB_TOKEN GITHUB_REPOSITORY release_sync_github_token
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "No merged PR associated with deployed master SHA" >&2
            exit 1
          else
            echo "Warning: no PR associated with manual deploy ref; release note sync skipped" >&2
          fi

          docker compose --env-file .env.production -f compose.prod.yml up -d --force-recreate api
          verify_api_deployment
          ./scripts/prod-security-check.sh </dev/null
          verify_public_api_revision
          verify_telegram_webhook
          release_digest_scheduler_disabled=0
          trap - EXIT
          REMOTE

          trap - EXIT
          cleanup_remote_token
