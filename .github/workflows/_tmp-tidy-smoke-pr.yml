name: Temporary tidy fullscreen smoke test

on:
  push:
    branches:
      - fix/desktop-miniapp-window-pr2

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-miniapp-window-pr2
          fetch-depth: 0

      - name: Tidy smoke test formatting
        shell: python
        run: |
          from pathlib import Path
          path = Path("apps/miniapp/test/smokeAssets.test.js")
          text = path.read_text(encoding="utf-8")
          start_marker = '  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);'
          end_marker = '  assert.match(app, /function syncFullscreenControlSafeArea\\(\\)/);'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              '  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);\n'
              '  const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");\n'
              '  const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");\n'
              '  assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");\n'
              '  assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);\n'
          )
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          Path(".github/workflows/_tmp-tidy-smoke-pr.yml").unlink()

      - name: Verify
        run: |
          node --test apps/miniapp/test/telegramPlatform.test.js apps/miniapp/test/smokeAssets.test.js
          git diff --check

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/miniapp/test/smokeAssets.test.js .github/workflows/_tmp-tidy-smoke-pr.yml
          git commit -m "Tidy fullscreen regression test"
          git push origin HEAD:fix/desktop-miniapp-window-pr2
