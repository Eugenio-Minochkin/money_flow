name: Temporary desktop Mini App formatting

on:
  push:
    branches:
      - fix/desktop-miniapp-window

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-miniapp-window
          fetch-depth: 0

      - name: Normalize focused edit formatting
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("apps/miniapp/src/app.js")
          app = app_path.read_text(encoding="utf-8")
          old = '''  if (shouldRequestTelegramFullscreen(webApp.platform)) {
          try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }
        }
        }'''
          if old not in app:
            old = '''  if (shouldRequestTelegramFullscreen(webApp.platform)) {
          try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }
        }
      }'''
          if old not in app:
            old = '''  if (shouldRequestTelegramFullscreen(webApp.platform)) {
        try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }
      }
      }'''
          if old not in app:
            old = '''  if (shouldRequestTelegramFullscreen(webApp.platform)) {
        try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }
      }
    }'''
          assert old in app, "expected fullscreen block not found"
          new = '''  if (shouldRequestTelegramFullscreen(webApp.platform)) {
            try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }
          }
        }'''
          # Dedent the YAML/Python source indentation to the desired JS indentation.
          new = new.replace("          try", "    try").replace("        }\n      }", "  }\n}")
          app_path.write_text(app.replace(old, new, 1), encoding="utf-8")

          smoke_path = Path("apps/miniapp/test/smokeAssets.test.js")
          smoke = smoke_path.read_text(encoding="utf-8")
          old_smoke = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
        const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
        const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
        assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
        assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);'''
          if old_smoke not in smoke:
            old_smoke = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
          const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
          const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
          assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
          assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);'''
          if old_smoke not in smoke:
            old_smoke = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
        const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
        const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
        assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
        assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);'''
          if old_smoke not in smoke:
            # Handle the exact unindented output from the previous patch.
            old_smoke = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
        const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
        const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
        assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
        assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);'''
          target_start = '  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);\n'
          start = smoke.index(target_start)
          end_anchor = '  assert.match(app, /function syncFullscreenControlSafeArea\\(\\)/);'
          end = smoke.index(end_anchor, start)
          replacement = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
          const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
          const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
          assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
          assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);
          '''
          replacement = replacement.replace("          const", "  const").replace("          assert", "  assert").replace("          ", "")
          smoke = smoke[:start] + replacement + smoke[end:]
          smoke_path.write_text(smoke, encoding="utf-8")

          Path(".github/workflows/_tmp-format-desktop-miniapp-window.yml").unlink()

      - name: Verify formatting edit
        run: |
          node --check apps/miniapp/src/app.js
          node --test apps/miniapp/test/telegramPlatform.test.js apps/miniapp/test/smokeAssets.test.js
          git diff --check

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/miniapp/src/app.js apps/miniapp/test/smokeAssets.test.js .github/workflows/_tmp-format-desktop-miniapp-window.yml
          git commit -m "Tidy desktop fullscreen guard"
          git push origin HEAD:fix/desktop-miniapp-window
