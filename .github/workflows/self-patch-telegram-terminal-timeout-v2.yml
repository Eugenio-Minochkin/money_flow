name: Self patch Telegram terminal timeout v2

on:
  push:
    branches: [fix/telegram-terminal-timeout]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: fix/telegram-terminal-timeout

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Apply corrected patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/self-patch-telegram-terminal-timeout.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          code = code.replace(
              "ref_marker = '          await repository.setDraftMessageRef'",
              "ref_marker = 'await repository.setDraftMessageRef'"
          )
          code = code.replace(
              "block = block.replace(ref_marker, '          void repository.setDraftMessageRef')",
              "block = block.replace(ref_marker, 'void repository.setDraftMessageRef')"
          )
          exec(compile(code, '<telegram-terminal-timeout-patch>', 'exec'))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run focused regression tests
        run: node --test apps/api/test/telegramJobOutcome.test.js

      - name: Run full test suite
        run: npm test

      - name: Verify diff
        run: git diff --check

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/self-patch-telegram-terminal-timeout.yml
          rm .github/workflows/self-patch-telegram-terminal-timeout-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/telegram.js apps/api/src/telegramJobOutcome.js apps/api/test/telegramJobOutcome.test.js .github/workflows/self-patch-telegram-terminal-timeout.yml .github/workflows/self-patch-telegram-terminal-timeout-v2.yml
          git commit -m "fix: suppress false Telegram failure after terminal response"
          git push origin HEAD:fix/telegram-terminal-timeout
