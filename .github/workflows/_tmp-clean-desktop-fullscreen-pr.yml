name: Temporary clean desktop fullscreen PR

on:
  push:
    branches:
      - fix/desktop-miniapp-window-pr2

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/desktop-miniapp-window-pr2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean formatting
        shell: python
        run: |
          from pathlib import Path

          app_path = Path("apps/miniapp/src/app.js")
          app = app_path.read_text(encoding="utf-8")
          old = '  if (shouldRequestTelegramFullscreen(webApp.platform)) {\n  try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }\n}\n}'
          new = '  if (shouldRequestTelegramFullscreen(webApp.platform)) {\n    try { webApp.requestFullscreen?.(); } catch { /* expand remains the fallback */ }\n  }\n}'
          assert old in app
          app_path.write_text(app.replace(old, new, 1), encoding="utf-8")

          smoke_path = Path("apps/miniapp/test/smokeAssets.test.js")
          smoke = smoke_path.read_text(encoding="utf-8")
          old = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
          const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
          const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
          assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
          assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);'''
          # Generated patch may have lost indentation after the first line.
          start = smoke.index('  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);')
          end = smoke.index('  assert.match(app, /function syncFullscreenControlSafeArea\\(\\)/);', start)
          new = '''  assert.match(app, /from "\\.\\/telegramPlatform\\.js"/);
          const fullscreenGuard = app.indexOf("if (shouldRequestTelegramFullscreen(webApp.platform))");
          const fullscreenRequest = app.indexOf("webApp.requestFullscreen?.()");
          assert.ok(fullscreenGuard >= 0 && fullscreenRequest > fullscreenGuard, "fullscreen request must be guarded by Telegram mobile platform");
          assert.equal((app.match(/webApp\\.requestFullscreen\\?\\.\\(\\)/g) ?? []).length, 1);
          '''
          new = new.replace("          const", "  const").replace("          assert", "  assert").replace("          ", "")
          smoke_path.write_text(smoke[:start] + new + smoke[end:], encoding="utf-8")

          Path(".github/workflows/_tmp-clean-desktop-fullscreen-pr.yml").unlink()

      - name: Install dependencies
        run: npm ci

      - name: Verify focused change
        run: |
          node --check apps/miniapp/src/app.js
          node --test apps/miniapp/test/telegramPlatform.test.js apps/miniapp/test/smokeAssets.test.js
          npm run build:miniapp
          git diff --check

      - name: Commit clean result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/miniapp/src/app.js apps/miniapp/test/smokeAssets.test.js .github/workflows/_tmp-clean-desktop-fullscreen-pr.yml
          git commit -m "Tidy desktop fullscreen guard"
          git push origin HEAD:fix/desktop-miniapp-window-pr2
