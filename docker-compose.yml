services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: money_flow
      POSTGRES_USER: money_flow
      POSTGRES_PASSWORD: money_flow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
