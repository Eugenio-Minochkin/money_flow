services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
      MINI_APP_URL: https://${APP_DOMAIN}
      DEFAULT_MONTHLY_BUDGET: ${DEFAULT_MONTHLY_BUDGET:-45000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      NODE_ENV: production
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}
      REQUIRE_TELEGRAM_INIT_DATA: ${REQUIRE_TELEGRAM_INIT_DATA:-true}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-120}
      RATE_LIMIT_BUCKET_TTL_MS: ${RATE_LIMIT_BUCKET_TTL_MS:-120000}
      RATE_LIMIT_CLEANUP_INTERVAL_MS: ${RATE_LIMIT_CLEANUP_INTERVAL_MS:-60000}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-127.0.0.1,::1}
      MAX_JSON_BYTES: ${MAX_JSON_BYTES:-256000}
      TELEGRAM_JOB_GLOBAL_CONCURRENCY: ${TELEGRAM_JOB_GLOBAL_CONCURRENCY:-3}
      TELEGRAM_JOB_USER_QUEUE_LIMIT: ${TELEGRAM_JOB_USER_QUEUE_LIMIT:-2}
      TELEGRAM_JOB_TIMEOUT_MS: ${TELEGRAM_JOB_TIMEOUT_MS:-90000}
      EXPENSE_FAST_PATH_MODE: ${EXPENSE_FAST_PATH_MODE:-off}
      EXPENSE_PARSER_FAST_PATH_MODE: ${EXPENSE_PARSER_FAST_PATH_MODE:-}
      EXPENSE_PARSER_LOCAL_FIRST_ROLLOUT_PERCENT: ${EXPENSE_PARSER_LOCAL_FIRST_ROLLOUT_PERCENT:-0}
      EXPENSE_PARSER_LOCAL_FIRST_USER_IDS: ${EXPENSE_PARSER_LOCAL_FIRST_USER_IDS:-}
      EXPENSE_PARSER_MAX_LOCAL_AMOUNT: ${EXPENSE_PARSER_MAX_LOCAL_AMOUNT:-1000000}
      PARSER_TEXT_HASH_SECRET: ${PARSER_TEXT_HASH_SECRET:-}
      RELEASE_DIGEST_AUTO_SEND_ENABLED: ${RELEASE_DIGEST_AUTO_SEND_ENABLED:-false}
      RELEASE_DIGEST_TIMEZONE: ${RELEASE_DIGEST_TIMEZONE:-Asia/Bangkok}
      RELEASE_DIGEST_SEND_HOUR: ${RELEASE_DIGEST_SEND_HOUR:-21}
      RELEASE_DIGEST_CHECK_INTERVAL_MINUTES: ${RELEASE_DIGEST_CHECK_INTERVAL_MINUTES:-15}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-}
      DAILY_REMINDER_GLOBAL_ENABLED: ${DAILY_REMINDER_GLOBAL_ENABLED:-false}
      DAILY_REMINDER_ROLLOUT_PERCENT: ${DAILY_REMINDER_ROLLOUT_PERCENT:-0}
      DAILY_REMINDER_INTERVAL_MS: ${DAILY_REMINDER_INTERVAL_MS:-600000}
      PORT: 3000
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
